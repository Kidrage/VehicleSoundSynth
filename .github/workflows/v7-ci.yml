name: V7 portable contracts and package
on:
  push:
    branches: [EV-Engine-V7]
  pull_request:
    branches: [EV-Engine-V7]
permissions:
  contents: read
concurrency:
  group: v7-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify implementation and clean publication state
        id: ready
        shell: bash
        run: |
          if test -f tools/build_v7.py; then
            echo 'implementation=true' >> "$GITHUB_OUTPUT"
          else
            echo 'implementation=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap commit only; no implementation acceptance claimed.'
          fi
          if test -f tools/build_v7.py && ! test -d .agentlab/v7-transfer && ! test -f .github/workflows/v7-apply.yml && ! test -f .github/workflows/v7-workspace-export.yml; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.implementation == 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.implementation == 'true'
        with:
          node-version: '22'
      - name: Install pinned QA dependencies
        if: steps.ready.outputs.implementation == 'true'
        run: python -m pip install -r requirements-v7-qa.txt
      - name: Verify generated resources and complete portable test suite
        if: steps.ready.outputs.implementation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          python tools/build_v7.py --check
          python tools/validate_v7.py --portable --report qa/portable.json 2>&1 | tee qa/portable.log
      - name: Package the exact clean tested commit
        if: steps.ready.outputs.clean == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/v7-release"
          git archive --format=zip --prefix=EV-Engine-V7/ --output="$RUNNER_TEMP/v7-release/EV-Engine-V7_$(git rev-parse --short=7 HEAD).zip" HEAD
          python - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,subprocess,zipfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v7-release'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          main=subprocess.check_output(['git','rev-parse','refs/remotes/origin/main'],text=True).strip()
          assert main=='ac2b37d8639027d79934a2023cf8d1d37d3b2f96', 'Main changed; review repository baseline before publication.'
          paths=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          assert '.github/workflows/v7-apply.yml' not in paths
          assert '.github/workflows/v7-workspace-export.yml' not in paths
          assert not any('v7-transfer/' in p for p in paths)
          patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',rb'github_pat_[A-Za-z0-9_]{30,}',rb'gh[pousr]_[A-Za-z0-9]{30,}',rb'AKIA[0-9A-Z]{16}']
          rows=[]
          for name in paths:
              data=(root/name).read_bytes()
              assert not any(re.search(pattern,data) for pattern in patterns),'Credential-like content: '+name
              rows.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          qa=json.loads((root/'qa/portable.json').read_text())
          assert qa['portable_success'] and not qa['failures'] and not qa['errors']
          (out/'FILE_MANIFEST.json').write_text(json.dumps({'commit':sha,'files':rows},ensure_ascii=False,indent=2)+'\n')
          release={'repository':'Kidrage/VehicleSoundSynth','private':True,'branch':'EV-Engine-V7','commit':sha,'baseline_commit':'fed2b78ecfabc84d673207b3a5f714b89f76720f','default_branch':'main','main_commit_unchanged':main,'tracked_files':len(paths),'generated_files':len(json.loads((root/'assets/v7/generated_sha256.json').read_text())),'manual':'V7_MANUAL.md','native_max_accepted':False,'vehicle_accepted':False,'qa':qa,'contains_git_history':False,'temporary_transfer_removed':True,'known_credential_pattern_scan_passed':True}
          (out/'RELEASE_MANIFEST.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n')
          for name in ('V7_MANUAL.md','V7_CODEX_HANDOFF.md'):shutil.copy2(root/name,out/name)
          shutil.copy2(root/'qa/portable.json',out/'PORTABLE_QA.json')
          shutil.copy2(root/'qa/portable.log',out/'PORTABLE_QA.log')
          for archive in out.glob('*.zip'):
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  files=[n for n in z.namelist() if not n.endswith('/')]
                  assert set(files)=={'EV-Engine-V7/'+p for p in paths}
          (out/'SHA256SUMS').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.iterdir()) if p.is_file())+'\n')
          print(json.dumps({'commit':sha,'tracked_files':len(paths),'tests':qa['tests_run'],'passed':qa['passed'],'skipped':len(qa['skips'])},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: success() && steps.ready.outputs.clean == 'true' && github.event_name == 'push'
        with:
          name: EV-Engine-V7-release
          path: ${{ runner.temp }}/v7-release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.implementation == 'true'
        with:
          name: v7-portable-qa
          path: qa/
          retention-days: 14

name: V7 apply verified implementation
on:
  push:
    branches: [EV-Engine-V7]
    paths: [.github/workflows/v7-apply.yml]
permissions:
  contents: write
concurrency:
  group: v7-implementation-publication
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/EV-Engine-V7'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact source payload without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fed2b78ecfabc84d673207b3a5f714b89f76720f HEAD
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          data=base64.b64decode(''.join((root/f'.agentlab/v7-transfer/part{i:02d}.b64').read_text().strip() for i in range(1,6)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='829bd6bc12fb1f5ef3e7be78f0d4fa050c711305e10cc7d543af5122da34376a'
          payload=json.loads(lzma.decompress(data))
          assert payload['base_commit']=='fed2b78ecfabc84d673207b3a5f714b89f76720f'
          def safe(name):
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              return root.joinpath(*p.parts)
          for name,text in payload['files'].items():
              if name.startswith('.github/workflows/'):
                  print('Preserve connector-managed workflow:',name)
                  assert safe(name).exists()
                  continue
              p=safe(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          patch=payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name in payload['remove']:safe(name).unlink()
          subprocess.run(['python','tools/build_v7.py'],check=True)
          index=json.loads((root/'assets/v7/generated_sha256.json').read_text())
          digest=hashlib.sha256(json.dumps(index,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert digest==payload['expected_generated_digest']=='235f8de86db60c3bbd0786060c733fd6d16af72e5915f9737dd572e08e290546'
          subprocess.run(['git','diff','--exit-code','--','.github/workflows'],check=True)
          print('Validated exact implementation; generated',len(index),'resource hashes.')
          PY
      - name: Install pinned QA dependencies
        run: python -m pip install -r requirements-v7-qa.txt
      - name: Validate all portable legacy and V7 tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          python tools/build_v7.py --check
          python tools/validate_v7.py --portable --report qa/portable.json 2>&1 | tee qa/portable.log
      - name: Publish code and documentation only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,shutil,json,re
          root=pathlib.Path.cwd()
          report=json.loads((root/'qa/portable.json').read_text())
          assert report['portable_success'] and not report['failures'] and not report['errors']
          (root/'docs/v7').mkdir(parents=True,exist_ok=True)
          shutil.copy2(root/'qa/portable.json',root/'docs/v7/PORTABLE_QA.json')
          shutil.rmtree(root/'.agentlab/v7-transfer')
          patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',rb'github_pat_[A-Za-z0-9_]{30,}',rb'gh[pousr]_[A-Za-z0-9]{30,}',rb'AKIA[0-9A-Z]{16}']
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'qa' in p.relative_to(root).parts or '__pycache__' in p.parts:continue
              assert not any(re.search(pattern,p.read_bytes()) for pattern in patterns),'Credential-like content: '+str(p.relative_to(root))
          print('Known credential-pattern scan passed; temporary payload removed. Workflows remain connector-managed.')
          PY
          git diff --exit-code -- .github/workflows
          git config user.name 'VehicleSoundSynth V7 QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code gen patchers presets assets tools tests main.maxpat EV-Engine-V7* requirements-v7-qa.txt .gitignore
          git commit -m 'feat(v7): implement five-engine control, persistent mix design and annotated main UI'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'docs(v7): retain one manual and record verified delivery boundaries'
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/EV-Engine-V7 | cut -f1)" = '${{ github.sha }}'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'ac2b37d8639027d79934a2023cf8d1d37d3b2f96'
          git push origin HEAD:refs/heads/EV-Engine-V7
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EV-Engine-V7-publication-qa
          path: qa/
          retention-days: 3

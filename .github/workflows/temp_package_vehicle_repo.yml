name: temp-package-vehicle-repository

on:
  push:
    branches:
      - temp/ioniq6n-material-analysis-20260902
    paths:
      - .github/workflows/temp_package_vehicle_repo.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical main snapshot with full history
        uses: actions/checkout@v4
        with:
          ref: ade2fb55c0d95fb173a75b99cc848011b7c20e4f
          fetch-depth: 0
          fetch-tags: true
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Validate and package repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/vehicle-repo-package"
          mkdir -p "$OUT"

          git -C "$ROOT" status --short --branch
          git -C "$ROOT" fsck --full
          git -C "$ROOT" submodule status --recursive > "$OUT/submodules.txt" || true

          if grep -Eiq '(x-access-token|ghs_|github_pat_|authorization)' "$ROOT/.git/config"; then
            echo 'Credential-like material found in .git/config; refusing to package.' >&2
            exit 1
          fi

          git -C "$ROOT" rev-parse HEAD > "$OUT/commit.txt"
          git -C "$ROOT" branch -a > "$OUT/branches.txt"
          git -C "$ROOT" tag -l > "$OUT/tags.txt"
          git -C "$ROOT" count-objects -vH > "$OUT/git-object-stats.txt"
          git -C "$ROOT" ls-files -z | python -c 'import sys; print(sys.stdin.buffer.read().count(b"\0"))' > "$OUT/tracked-file-count.txt"

          git -C "$ROOT" bundle create "$OUT/VehicleSoundSynth-all-refs.bundle" --all
          git -C "$ROOT" archive --format=zip --output="$OUT/VehicleSoundSynth-main-source-only.zip" HEAD

          PARENT="$(dirname "$ROOT")"
          NAME="$(basename "$ROOT")"
          tar -C "$PARENT" -czf "$OUT/VehicleSoundSynth-complete-working-repository.tar.gz" "$NAME"

          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vehicle-repo-package'
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          files = []
          for p in sorted(out.iterdir()):
              if not p.is_file():
                  continue
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              files.append({'name': p.name, 'size_bytes': p.stat().st_size, 'sha256': h.hexdigest()})
          payload = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'canonical_branch': 'main',
              'commit': subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip(),
              'files': files,
          }
          (out / 'PACKAGE_MANIFEST.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY

          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
          ls -lah "$OUT"

      - name: Upload complete repository package
        uses: actions/upload-artifact@v4
        with:
          name: VehicleSoundSynth-complete-repository-ade2fb55
          path: ${{ runner.temp }}/vehicle-repo-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

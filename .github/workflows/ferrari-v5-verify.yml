name: Verify Ferrari SF90 V5
on:
  push:
    branches: [codex/v6-ferrari-sf90-v5]
    paths:
      - tools/ferrari_sf90_v5.py
      - tools/install_ferrari_v5.py
      - tools/check_ferrari_v5_math.py
      - code/ferrari_v5_state.js
      - tests/test_ferrari_sf90_v5.py
      - .agentlab/FERRARI_SF90_V5_2026-09-20.md
      - .github/workflows/ferrari-v5-verify.yml
permissions:
  contents: write
concurrency:
  group: ferrari-v5-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      BASE: 739c9d9a19432ac693e1a10a7ecd0cbb6b283dc8
      BRANCH: codex/v6-ferrari-sf90-v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard parent and integrate V5 into generators/tests/docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if s.count(old)!=count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), got {s.count(old)} for {old!r}")
              p.write_text(s.replace(old,new))

          # build_project: register one new Ferrari version; no IONIQ edits.
          replace("tools/build_project.py",
              "from . import dna_v3, ioniq_dna_v2, timbre_repair, ioniq_weight_balance",
              "from . import dna_v3, ioniq_dna_v2, timbre_repair, ioniq_weight_balance, ferrari_sf90_v5")
          replace("tools/build_project.py",
              "\\n    import dna_v3, ioniq_dna_v2, timbre_repair, ioniq_weight_balance\\n",
              "\\n    import dna_v3, ioniq_dna_v2, timbre_repair, ioniq_weight_balance, ferrari_sf90_v5\\n")
          replace("tools/build_project.py",
              'dna_voice = "ferrari_acoustic_v4~" if profile == "ferrari"',
              'dna_voice = "ferrari_acoustic_v5~" if profile == "ferrari"')
          replace("tools/build_project.py",
              "GEN_CODE['ferrari_dna_source_v4'] = timbre_repair.ferrari_code(GEN_CODE['ferrari_dna_source_v3'])",
              "GEN_CODE['ferrari_dna_source_v4'] = timbre_repair.ferrari_code(GEN_CODE['ferrari_dna_source_v3'])\nGEN_CODE['ferrari_dna_source_v5'] = ferrari_sf90_v5.source_code(GEN_CODE['ferrari_dna_source_v4'])")
          replace("tools/build_project.py",
              "    ioniq_weight_balance.register(contents)",
              "    ioniq_weight_balance.register(contents)\n    ferrari_sf90_v5.register(contents)")
          replace("tools/build_project.py",
              "    ioniq_weight_balance.write_outputs(root)",
              "    ioniq_weight_balance.write_outputs(root)\n    ferrari_sf90_v5.write_outputs(root)")

          # Project structural tests.
          replace("tests/test_project.py",
              'self.assertIn("ferrari_acoustic_v4~", engine)',
              'self.assertIn("ferrari_acoustic_v5~", engine)')
          replace("tests/test_project.py",
              '"ioniq6n_powertrain_v4.gendsp", "ioniq6n_weight_bed.gendsp",',
              '"ioniq6n_powertrain_v4.gendsp", "ioniq6n_weight_bed.gendsp",\n            "ferrari_dna_source_v5.gendsp",')
          replace("tests/test_project.py",
              "path.stem.endswith(('_dna_source_v3', '_dna_source_v4'))",
              "path.stem.endswith(('_dna_source_v3', '_dna_source_v4', '_dna_source_v5'))")
          replace("tests/test_project.py",
              'if path.name in {"ioniq6n_powertrain_v3.gendsp", "ferrari_dna_source_v4.gendsp"}:\n                required |= {"reference_restore", "accel"}',
              'if path.name in {"ioniq6n_powertrain_v3.gendsp", "ferrari_dna_source_v4.gendsp", "ferrari_dna_source_v5.gendsp"}:\n                required |= {"reference_restore", "accel"}\n            if path.name == "ferrari_dna_source_v5.gendsp":\n                required |= {"sf90_material"}')

          # Historical V4 test still proves that only the Ferrari abstraction seam changed.
          replace("tests/test_timbre_repair.py",
              "('ferrari','ferrari_acoustic_v3~','ferrari_acoustic_v4~')",
              "('ferrari','ferrari_acoustic_v3~','ferrari_acoustic_v5~')")

          # Visible-control audit follows the active V5 designer.
          replace("tools/audit_v3_controls.py",
              "if name=='ferrari_dna_v4_designer~.maxpat': return 'ferrari_sound_dna_v4.json'",
              "if name=='ferrari_dna_v5_designer~.maxpat': return 'ferrari_sound_dna_v5.json'\n        if name=='ferrari_dna_v4_designer~.maxpat': return 'ferrari_sound_dna_v4.json'")
          replace("tools/audit_v3_controls.py",
              "if path.name in ('ferrari_dna_v4_designer~.maxpat','ioniq6n_sound_dna_v4~.maxpat','ioniq6n_sound_dna_v3~.maxpat')",
              "if path.name in ('ferrari_dna_v5_designer~.maxpat','ferrari_dna_v4_designer~.maxpat','ioniq6n_sound_dna_v4~.maxpat','ioniq6n_sound_dna_v3~.maxpat')")
          replace("tests/test_design_control.py",
              "ferrari_dna_v4_designer~.maxpat",
              "ferrari_dna_v5_designer~.maxpat")
          replace("tests/test_design_control.py",
              "ferrari_sound_dna_v4.json",
              "ferrari_sound_dna_v5.json")

          # Current-authority docs: prepend, never delete prior rollback notes.
          inserts = {
            "AGENTS.md": "- **Ferrari SF90 V5 candidate (2026-09-20):** branch `codex/v6-ferrari-sf90-v5` from accepted IONIQ checkpoint `739c9d9`. Read `.agentlab/FERRARI_SF90_V5_2026-09-20.md`. Only Ferrari active DNA/versioned state may change; IONIQ/EV/V10/V12, driving, Start/Pop, Soundscape, Noise residual routing and old states are protected. Use `tools/install_ferrari_v5.py`; no native/listening acceptance is implied by scalar/unit tests.\n\n",
            ".codex/MAINLINE.md": "## Current Ferrari SF90 V5 candidate (2026-09-20)\n\nBranch `codex/v6-ferrari-sf90-v5`, parent/checkpoint `739c9d9`. Active Ferrari is `ferrari_acoustic_v5~` / `ferrari_dna_v5_designer~`; V4 and V2 remain rollback references. Read `.agentlab/FERRARI_SF90_V5_2026-09-20.md`.\n\n",
            ".codex/REPO_GUIDE.md": "## Current Ferrari SF90 V5 candidate (2026-09-20)\n\nActive Ferrari only: `patchers/ferrari_acoustic_v5~.maxpat` -> `gen/ferrari_dna_source_v5.gendsp` -> `patchers/ferrari_dna_v5_designer~.maxpat`. Recipe `tools/ferrari_sf90_v5.py`; state `code/ferrari_v5_state.js`; scoped installer `tools/install_ferrari_v5.py`; scalar QA `tools/check_ferrari_v5_math.py`. Parent/checkpoint `739c9d9`; IONIQ is protected.\n\n",
            ".codex/source_index.txt": "## Current Ferrari SF90 V5 candidate (2026-09-20)\n\n- .agentlab/FERRARI_SF90_V5_2026-09-20.md\n- tools/ferrari_sf90_v5.py\n- tools/install_ferrari_v5.py\n- tools/check_ferrari_v5_math.py\n- code/ferrari_v5_state.js\n- gen/ferrari_dna_source_v5.gendsp\n- patchers/ferrari_acoustic_v5~.maxpat\n- patchers/ferrari_dna_v5_designer~.maxpat\n- presets/ferrari_sound_dna_v5_factory.json\n- tests/test_ferrari_sf90_v5.py\n\n",
            "PROJECT_HANDOFF.md": "## 2026-09-20 — Ferrari SF90-reference V5 candidate\n\nParent/checkpoint: `739c9d9`; branch: `codex/v6-ferrari-sf90-v5`. Ferrari V5 replaces V4's extra RPM-tracking cavity/intake tones with pressure-excited fixed Body/Cavity/Mechanical modes while keeping random residuals in independent Noise. SF90 Material=0 is the V4 source bypass. See `.agentlab/FERRARI_SF90_V5_2026-09-20.md`. IONIQ and all non-Ferrari audio are protected.\n\n"
          }
          for path, block in inserts.items():
              p=Path(path); s=p.read_text()
              if block.strip() in s:
                  continue
              first=s.find("\n")+1
              p.write_text(s[:first]+block+s[first:])
          PY
          python3 -m py_compile tools/ferrari_sf90_v5.py tools/install_ferrari_v5.py tools/check_ferrari_v5_math.py
      - name: Install exact Max 8.6.5 BEAP generator dependencies without launching Max
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'numpy==2.2.6'
          curl --fail --location --retry 2 --max-time 600 https://downloads.cdn.cycling74.com/max8/Max865_241008.dmg -o "$RUNNER_TEMP/Max865.dmg"
          mkdir -p "$RUNNER_TEMP/max865"
          printf 'Y\n' | hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/max865" "$RUNNER_TEMP/Max865.dmg"
          SOURCE="$RUNNER_TEMP/max865/Max.app/Contents/Resources/C74/packages/BEAP/clippings/BEAP"
          DEST=/Applications/Max.app/Contents/Resources/C74/packages/BEAP/clippings/BEAP
          test -d "$SOURCE"
          sudo mkdir -p "$DEST"
          sudo cp -R "$SOURCE/." "$DEST/"
          hdiutil detach "$RUNNER_TEMP/max865"
          python3 - <<'PY'
          from tools import build_project as b
          import hashlib
          for name, expected in b.BEAP_CLIPPING_SHA256.items():
              actual=hashlib.sha256((b.BEAP_CLIPPING_ROOT/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print("BEAP clipping hashes verified")
          PY
      - name: Generate scoped Ferrari outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferrari-v5-qa"
          python3 tools/install_ferrari_v5.py | tee "$RUNNER_TEMP/ferrari-v5-qa/generation.log"
          git add tools/build_project.py tools/audit_v3_controls.py tests/test_project.py tests/test_timbre_repair.py tests/test_design_control.py             AGENTS.md .codex/MAINLINE.md .codex/REPO_GUIDE.md .codex/source_index.txt PROJECT_HANDOFF.md             VehicleSoundSynth-V6.maxproj patchers/vehicle_engine_ferrari~.maxpat             patchers/ferrari_acoustic_v5~.maxpat patchers/ferrari_dna_v5_designer~.maxpat             gen/ferrari_dna_source_v5.gendsp presets/ferrari_sound_dna_v5_factory.json
          git diff --cached --check
          git diff --cached --name-status > "$RUNNER_TEMP/ferrari-v5-qa/changed-files.txt"
      - name: Full macOS unit suite
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/afconvert
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/ferrari-v5-qa/full-tests.log"
      - name: Scalar source proxy and deterministic generation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ferrari_v5_math.py "$RUNNER_TEMP/ferrari-v5-qa/math" 2>&1 | tee "$RUNNER_TEMP/ferrari-v5-qa/math.log"
          python3 - <<'PY'
          from tools.install_ferrari_v5 import outputs
          from tools import build_project as b
          from pathlib import Path
          import hashlib,json,os,tempfile,subprocess
          a=outputs(); assert a==outputs()
          report={"kind":"scoped deterministic generation; NOT native Max","count":len(a),"files":{}}
          with tempfile.TemporaryDirectory() as tmp:
              for name,doc in a.items():
                  p=Path(tmp)/name; b.write_json(p,doc)
                  assert p.read_bytes()==Path(name).read_bytes(),name
                  report["files"][name]=hashlib.sha256(p.read_bytes()).hexdigest()
          qa=Path(os.environ["RUNNER_TEMP"])/"ferrari-v5-qa"
          (qa/"deterministic.json").write_text(json.dumps(report,indent=2)+"\n")
          # Ferrari task must not alter any tracked IONIQ resource from checkpoint.
          names=subprocess.check_output(["git","ls-tree","-r","--name-only",os.environ["BASE"],"gen","patchers","code","presets"],text=True).splitlines()
          kept=[]
          for name in names:
              if "ioniq6n" not in name and "ioniq_weight" not in name: continue
              data=Path(name).read_bytes()
              assert data==subprocess.check_output(["git","show",os.environ["BASE"]+":"+name]),name
              kept.append(name)
          (qa/"ioniq-preserved.json").write_text(json.dumps({"count":len(kept),"paths":kept},indent=2)+"\n")
          PY
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git add .
          git diff --cached --check
          git config user.name 'VehicleSoundSynth QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ferrari-v5-verify.yml
          git commit -m 'fix(ferrari): rebuild DNA around SF90 pressure and fixed structure'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/ferrari-v5-qa/COMMIT_SHA.txt"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/ferrari-v5-qa/COMMIT.txt"
          git diff --binary "$BASE" HEAD > "$RUNNER_TEMP/ferrari-v5-qa/repair.patch"
          git bundle create "$RUNNER_TEMP/ferrari-v5-qa/repair.bundle" "$BRANCH" "^$BASE"
          git bundle verify "$RUNNER_TEMP/ferrari-v5-qa/repair.bundle"
          cp .agentlab/FERRARI_SF90_V5_2026-09-20.md "$RUNNER_TEMP/ferrari-v5-qa/CODEX_HANDOFF.md"
          printf 'native_max_tested=false\nlistening_tested=false\nioniq_preserved=true\n' > "$RUNNER_TEMP/ferrari-v5-qa/ACCEPTANCE_BOUNDARY.txt"
          cd "$RUNNER_TEMP/ferrari-v5-qa"
          shasum -a 256 COMMIT_SHA.txt repair.patch repair.bundle full-tests.log math/source_report.json math/source_metrics.csv > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-sf90-v5-verified-delivery
          path: ${{ runner.temp }}/ferrari-v5-qa/
          if-no-files-found: error
          retention-days: 7

name: temp-ioniq6n-material-analysis

on:
  push:
    branches:
      - temp/ioniq6n-material-analysis-20260902

permissions:
  contents: read

jobs:
  acquire-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install current extractors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider requests
          npm install --no-save youtubei.js

      - name: Acquire exact public reference through independent extractor paths
        shell: bash
        run: |
          set -u
          mkdir -p out diagnostics
          URL='https://www.youtube.com/watch?v=QjdRMwsym1I'
          VID='QjdRMwsym1I'
          SUCCESS=0

          echo '=== Start BgUtils PO-token provider ===' | tee diagnostics/summary.log
          docker run --name bgutil-provider -d --init -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest > diagnostics/bgutil_container_id.txt 2>&1 || true
          sleep 5
          docker logs bgutil-provider > diagnostics/bgutil_provider.log 2>&1 || true
          curl -fsS http://127.0.0.1:4416/ > diagnostics/bgutil_health.txt 2>&1 || true

          try_ytdlp() {
            local label="$1"; local clients="$2"
            echo "=== yt-dlp + PO token: $label ($clients) ===" | tee -a diagnostics/summary.log
            yt-dlp -v \
              --no-playlist \
              --js-runtimes node \
              --remote-components ejs:github \
              --impersonate chrome \
              --extractor-args "youtube:player_client=${clients}" \
              -f 'bestaudio[ext=webm]/bestaudio[ext=m4a]/bestaudio' \
              -o "out/ioniq6n_source_${label}.%(ext)s" \
              "$URL" > "diagnostics/ytdlp_${label}.log" 2>&1
            local rc=$?
            cat "diagnostics/ytdlp_${label}.log"
            if [ "$rc" -eq 0 ]; then SUCCESS=1; fi
            return "$rc"
          }

          try_ytdlp mweb 'mweb' || true
          if [ "$SUCCESS" -eq 0 ]; then try_ytdlp web 'web,web_safari' || true; fi
          if [ "$SUCCESS" -eq 0 ]; then try_ytdlp mixed 'mweb,web_safari,android_vr' || true; fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo '=== youtubei.js direct path ===' | tee -a diagnostics/summary.log
            cat > diagnostics/youtubei_acquire.mjs <<'JS'
          import fs from 'node:fs';
          import { Innertube, UniversalCache } from 'youtubei.js';
          const id = 'QjdRMwsym1I';
          try {
            const yt = await Innertube.create({ cache: new UniversalCache(false), generate_session_locally: true });
            const info = await yt.getBasicInfo(id);
            fs.writeFileSync('diagnostics/youtubei_info.json', JSON.stringify(info.basic_info, null, 2));
            const stream = await info.download({ type: 'audio', quality: 'best', format: 'any' });
            const reader = stream.getReader();
            const fd = fs.openSync('out/ioniq6n_source_youtubei.bin', 'w');
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              fs.writeSync(fd, value);
              total += value.length;
            }
            fs.closeSync(fd);
            console.log(`YOUTUBEI_SUCCESS bytes=${total}`);
            if (total < 1000000) process.exit(2);
          } catch (err) {
            fs.writeFileSync('diagnostics/youtubei_error.txt', String(err?.stack || err));
            console.error(err);
            process.exit(1);
          }
          JS
            node diagnostics/youtubei_acquire.mjs > diagnostics/youtubei_stdout.log 2>&1
            if [ "$?" -eq 0 ]; then SUCCESS=1; fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo '=== self-hosted cobalt path ===' | tee -a diagnostics/summary.log
            docker run --name cobalt -d --init -p 9000:9000 -e API_URL=http://127.0.0.1:9000/ ghcr.io/imputnet/cobalt:11 > diagnostics/cobalt_container_id.txt 2>&1 || true
            sleep 10
            docker logs cobalt > diagnostics/cobalt_server.log 2>&1 || true
            python - <<'PY'
          import json, pathlib, requests, sys, time
          base='http://127.0.0.1:9000'
          payload={'url':'https://www.youtube.com/watch?v=QjdRMwsym1I','downloadMode':'audio','audioFormat':'best','filenameStyle':'basic','youtubeHLS':True}
          try:
              r=requests.post(base+'/',json=payload,headers={'Accept':'application/json','Content-Type':'application/json'},timeout=120)
              pathlib.Path('diagnostics/cobalt_response.txt').write_text(f'HTTP {r.status_code}\n{r.text}',encoding='utf-8')
              r.raise_for_status()
              data=r.json(); url=data.get('url')
              if data.get('status') not in {'redirect','tunnel'} or not url: raise RuntimeError(data)
              with requests.get(url,stream=True,timeout=(20,360)) as s:
                  s.raise_for_status(); total=0
                  with open('out/ioniq6n_source_cobalt.bin','wb') as f:
                      for chunk in s.iter_content(1024*1024):
                          if chunk: f.write(chunk); total += len(chunk)
              print('COBALT_SUCCESS',total)
              if total < 1000000: raise RuntimeError(f'too small {total}')
          except Exception as e:
              pathlib.Path('diagnostics/cobalt_client_error.txt').write_text(repr(e),encoding='utf-8')
              sys.exit(1)
          PY
            if [ "$?" -eq 0 ]; then SUCCESS=1; fi
          fi

          find out -maxdepth 1 -type f -size -1M -delete || true
          AUDIO_FILE="$(find out -maxdepth 1 -type f -name 'ioniq6n_source_*' -size +1M | head -n 1)"
          if [ "$SUCCESS" -eq 0 ] || [ -z "$AUDIO_FILE" ]; then
            echo 'ALL_EXTRACTION_PATHS_FAILED' | tee -a diagnostics/summary.log
            docker logs bgutil-provider >> diagnostics/bgutil_provider.log 2>&1 || true
            docker logs cobalt >> diagnostics/cobalt_server.log 2>&1 || true
            exit 1
          fi

          echo "Selected source: $AUDIO_FILE" | tee -a diagnostics/summary.log
          ffprobe -v error -show_format -show_streams -of json "$AUDIO_FILE" > out/ffprobe_source.json || true
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -y -i "$AUDIO_FILE" -vn -ar 48000 -ac 2 -c:a pcm_s24le out/ioniq6n_reference_48k_stereo.wav
            ffmpeg -hide_banner -y -i "$AUDIO_FILE" -vn -ar 48000 -ac 2 -c:a libmp3lame -b:a 192k out/ioniq6n_reference_48k_stereo.mp3
          fi
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out diagnostics

      - name: Upload acquisition result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioniq6n-audio-reference-attempt-3
          path: |
            out/
            diagnostics/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

name: temp-ioniq6n-material-analysis

on:
  push:
    branches:
      - temp/ioniq6n-material-analysis-20260902

permissions:
  contents: read

jobs:
  cobalt-acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current cobalt extractor with correct API headers
        shell: bash
        run: |
          set +e
          mkdir -p out diagnostics
          python -m pip install --upgrade requests
          docker run --name cobalt -d --init -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            ghcr.io/imputnet/cobalt:11 > diagnostics/cobalt_start.txt 2>&1
          sleep 12
          docker logs cobalt > diagnostics/cobalt_server_initial.log 2>&1
          python - <<'PY'
          import json, pathlib, requests, sys
          base='http://127.0.0.1:9000/'
          headers={'Accept':'application/json','Content-Type':'application/json'}
          variants=[
              {'url':'https://www.youtube.com/watch?v=QjdRMwsym1I','downloadMode':'audio','audioFormat':'best','filenameStyle':'basic','youtubeHLS':True},
              {'url':'https://www.youtube.com/watch?v=QjdRMwsym1I','downloadMode':'audio','audioFormat':'best','filenameStyle':'basic','youtubeBetterAudio':True},
              {'url':'https://youtu.be/QjdRMwsym1I','downloadMode':'audio','audioFormat':'mp3','audioBitrate':'320','filenameStyle':'basic','youtubeHLS':True},
          ]
          log=[]
          for i,payload in enumerate(variants,1):
              try:
                  r=requests.post(base,json=payload,headers=headers,timeout=180)
                  log.append({'attempt':i,'http':r.status_code,'body':r.text[:10000]})
                  r.raise_for_status(); data=r.json(); url=data.get('url')
                  if data.get('status') not in {'redirect','tunnel','picker'} or not url:
                      raise RuntimeError(data)
                  with requests.get(url,headers={'Accept':'*/*'},stream=True,timeout=(15,600),allow_redirects=True) as s:
                      s.raise_for_status(); total=0; ctype=s.headers.get('content-type','')
                      target=pathlib.Path(f'out/ioniq6n_source_cobalt_{i}.bin')
                      with target.open('wb') as f:
                          for chunk in s.iter_content(1024*1024):
                              if chunk: f.write(chunk); total += len(chunk)
                  log[-1].update({'download_bytes':total,'content_type':ctype,'media_url':url})
                  if total >= 1_000_000:
                      pathlib.Path('diagnostics/cobalt_attempts.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),encoding='utf-8')
                      sys.exit(0)
                  target.unlink(missing_ok=True)
              except Exception as e:
                  log[-1 if log else 0:]
                  if log: log[-1]['exception']=repr(e)
          pathlib.Path('diagnostics/cobalt_attempts.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),encoding='utf-8')
          sys.exit(1)
          PY
          RC=$?
          docker logs cobalt > diagnostics/cobalt_server_final.log 2>&1
          find out -type f -size -1M -delete || true
          find out -type f -maxdepth 1 -print -exec sha256sum {} \; > diagnostics/files.txt
          test "$RC" -eq 0 && test -n "$(find out -type f -size +1M -print -quit)"
      - name: Upload cobalt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioniq6n-cobalt-attempt
          path: |
            out/
            diagnostics/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
